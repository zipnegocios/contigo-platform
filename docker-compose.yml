version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16-latest
    container_name: contigo_postgres
    environment:
      POSTGRES_USER: contigo
      POSTGRES_PASSWORD: contigo_dev_password
      POSTGRES_DB: contigo_db
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=vector"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contigo"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: contigo_app
    environment:
      DATABASE_URL: postgresql://contigo:contigo_dev_password@postgres:5432/contigo_db
      NEXTAUTH_SECRET: dev-secret-key-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: development
      RESEND_API_KEY: ${RESEND_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
